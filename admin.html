<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SudutKopi Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div id="splash" class="splash"><span class="spin"></span></div>

  <!-- Login -->
  <section id="loginView" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="login-logo brand-logo-slot"></div>
      <h1><span class="brand-name-slot">SudutKopi</span> Admin</h1>
      <p class="muted">Masuk untuk mengelola menu, pesanan, dan pengaturan outlet.</p>
      <div class="field">
        <label for="lEmail">Email</label>
        <input id="lEmail" type="email" required autocomplete="username" placeholder="admin@email.com">
      </div>
      <div class="field">
        <label for="lPass">Kata sandi</label>
        <input id="lPass" type="password" required autocomplete="current-password" placeholder="Kata sandi">
      </div>
      <div class="form-error" id="loginErr"></div>
      <button class="btn primary block" id="loginBtn" type="submit">Masuk</button>
    </form>
  </section>

  <!-- Shell -->
  <div id="shell" class="shell hidden">
    <div class="side-bg" id="sideBg" data-act="burger"></div>
    <aside class="side" id="side">
      <div class="side-brand">
        <span class="side-logo brand-logo-slot"></span>
        <div><b class="brand-name-slot">SudutKopi</b><small>Admin Panel</small></div>
      </div>
      <nav class="side-nav" id="nav">
        <button class="nav-item" data-act="nav" data-page="dashboard"><span data-ic="dashboard"></span>Dashboard</button>
        <button class="nav-item" data-act="nav" data-page="orders"><span data-ic="receipt"></span>Pesanan<em class="nav-badge" id="badgeOrders" hidden>0</em></button>
        <button class="nav-item" data-act="nav" data-page="chat"><span data-ic="chat"></span>Chat<em class="nav-badge" id="badgeChat" hidden>0</em></button>
        <button class="nav-item" data-act="nav" data-page="menu"><span data-ic="coffee"></span>Menu</button>
        <button class="nav-item" data-act="nav" data-page="cats"><span data-ic="tag"></span>Kategori</button>
        <button class="nav-item" data-act="nav" data-page="tables"><span data-ic="table"></span>Meja</button>
        <button class="nav-item" data-act="nav" data-page="settings"><span data-ic="sliders"></span>Pengaturan</button>
      </nav>
      <div class="side-foot">
        <div class="who" id="who"></div>
        <button class="nav-item" data-act="logout"><span data-ic="logout"></span>Keluar</button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <button class="icon-btn burger" data-act="burger" aria-label="Menu"><span data-ic="burger"></span></button>
        <h2 id="pageTitle">Dashboard</h2>
        <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener"><span data-ic="link"></span>Lihat aplikasi</a>
      </header>
      <main id="page" class="page"></main>
    </div>
  </div>

  <div id="modalRoot" class="modal-root"></div>
  <div id="confirmRoot" class="modal-root"></div>
  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="qrcode.js"></script>
  <script src="admin.js"></script>
</body>
</html>
